services:
  wb2api:
    build: .
    container_name: workbuddy2api
    restart: unless-stopped
    # 容器默认以 app 用户（uid 10001）运行。宿主机挂载目录属主不同会导致
    # 「写入 auths/*.json.tmp 失败 permission denied」，三种解法任选：
    #   1) 非 root · 让容器以你自己的 uid 运行（挂载目录本来就是你建的）：
    #      PUID=$(id -u) PGID=$(id -g) docker compose up -d
    #      或写进 .env 文件：PUID=1000 / PGID=1000
    #   2) sudo chown -R 10001:10001 ./auths ./data ./config.json
    #   3) user: "0:0" 以 root 运行（省事但容器逃逸面更大，自担）
    user: "${PUID:-10001}:${PGID:-10001}"
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "7863:7863"
    volumes:
      - ./auths:/app/auths
      - ./data:/app/data
      # config/ 与 data/ 分离：前者是用户手改的配置（可单独备份/只读挂载），
      # 后者是程序自写的状态与归档。
      #
      # 升级提示：旧版把 config.json 直接挂在 /app/config.json。改成目录挂载后
      # 必须把宿主机配置文件移进 ./config/：
      #   mkdir -p config && mv config.json config/ 2>/dev/null
      # 若宿主机没有 ./config 目录，Docker 会把它创建成 root 所有的空目录，
      # 容器内 app 用户写不进去（程序会自动生成配置，但需要写权限）。
      # 首次启动未提供配置时，程序会在 config/ 下自动生成默认值并打印 api_key。
      #
      # 不挂 :ro：面板「配置」页需要写回这些文件（保存后热生效）。
      - ./config:/app/config
